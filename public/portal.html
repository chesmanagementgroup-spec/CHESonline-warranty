<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Equipment — CHES Online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%231a1a18%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia,serif%27 font-size=%2716%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="topbar">
  <span class="topbar-actions"><span id="companyName"></span></span>
  <span class="topbar-title">CHES Management Group</span>
  <span class="topbar-actions">
    <button type="button" id="langToggle" data-i18n="lang_toggle">中文</button>
    <button type="button" id="signOut" data-i18n="nav_signout">Sign out</button>
  </span>
</div>

<header class="header">
  <div class="logo">CHES<span class="logo-dot">.</span></div>
  <div class="header-sub" data-i18n="brand_sub">Equipment &amp; Warranty Portal</div>
</header>

<main class="page">

  <div class="stat-grid" id="statGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="equipment" data-i18n="tab_equipment">Equipment</button>
    <button class="tab" data-tab="requests" data-i18n="tab_requests">Service requests</button>
    <button class="tab" data-tab="details" data-i18n="tab_details">My details</button>
  </div>

  <!-- Equipment -->
  <section id="panel-equipment">
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-sm" id="reportBtn" data-i18n="claim_new">Report a problem</button>
      <button class="btn btn-ghost btn-sm" id="addDeviceBtn" data-i18n="dev_add">Add a machine manually</button>
    </div>
    <div id="deviceList"></div>
  </section>

  <!-- Service requests -->
  <section id="panel-requests" hidden>
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-sm" id="reportBtn2" data-i18n="claim_new">Report a problem</button>
    </div>
    <div id="claimList"></div>
  </section>

  <!-- Profile -->
  <section id="panel-details" hidden>
    <form id="profileForm" novalidate>
      <div class="section">
        <div class="section-header">
          <div class="section-num">1</div>
          <div class="section-title" data-i18n="profile_business">Business</div>
        </div>
        <div class="section-body">
          <p class="section-note" data-i18n="profile_lead"></p>
          <div class="row-2">
            <div class="field">
              <label for="company_name"><span data-i18n="profile_company">Business name</span> <span class="req">*</span></label>
              <input type="text" id="company_name" autocomplete="organization">
            </div>
            <div class="field">
              <label for="contact_name"><span data-i18n="profile_contact">Account contact</span> <span class="req">*</span></label>
              <input type="text" id="contact_name" autocomplete="name">
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="profileEmail" data-i18n="profile_email">Sign-in email</label>
              <input type="email" id="profileEmail" disabled>
              <div class="hint" data-i18n="profile_email_hint"></div>
            </div>
            <div class="field">
              <label for="phone"><span data-i18n="profile_phone">Phone</span> <span class="req">*</span></label>
              <input type="tel" id="phone" autocomplete="tel">
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-num">2</div>
          <div class="section-title" data-i18n="profile_address">Delivery / site address</div>
        </div>
        <div class="section-body">
          <div class="field">
            <label for="address_line1"><span data-i18n="profile_addr1">Street address</span> <span class="req">*</span></label>
            <input type="text" id="address_line1" autocomplete="address-line1">
          </div>
          <div class="field">
            <label for="address_line2" data-i18n="profile_addr2">Address line 2</label>
            <input type="text" id="address_line2" autocomplete="address-line2">
          </div>
          <div class="row-3">
            <div class="field">
              <label for="suburb"><span data-i18n="profile_suburb">Suburb</span> <span class="req">*</span></label>
              <input type="text" id="suburb" autocomplete="address-level2">
            </div>
            <div class="field">
              <label for="state"><span data-i18n="profile_state">State</span> <span class="req">*</span></label>
              <select id="state">
                <option value=""></option>
                <option>VIC</option><option>NSW</option><option>QLD</option><option>SA</option>
                <option>WA</option><option>TAS</option><option>NT</option><option>ACT</option>
              </select>
            </div>
            <div class="field">
              <label for="postcode"><span data-i18n="profile_postcode">Postcode</span> <span class="req">*</span></label>
              <input type="text" id="postcode" inputmode="numeric" maxlength="8" autocomplete="postal-code">
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-num">3</div>
          <div class="section-title" data-i18n="profile_site">On-site after-sales contact</div>
        </div>
        <div class="section-body">
          <p class="section-note" data-i18n="profile_site_lead"></p>
          <div class="row-2">
            <div class="field">
              <label for="site_contact_name"><span data-i18n="profile_site_name">Name</span> <span class="req">*</span></label>
              <input type="text" id="site_contact_name">
            </div>
            <div class="field">
              <label for="site_contact_role" data-i18n="profile_site_role">Role</label>
              <input type="text" id="site_contact_role" placeholder="Head chef / venue manager">
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="site_contact_phone"><span data-i18n="profile_site_phone">Phone</span> <span class="req">*</span></label>
              <input type="tel" id="site_contact_phone">
            </div>
            <div class="field">
              <label for="site_contact_email" data-i18n="profile_site_email">Email</label>
              <input type="email" id="site_contact_email">
            </div>
          </div>
          <button class="btn" type="submit" id="profileSave" data-i18n="profile_save">Save details</button>
          <div id="profileStatus" class="status"></div>
        </div>
      </div>
    </form>
  </section>

  <footer class="footer">
    <strong>CHES Online</strong> &nbsp;·&nbsp; chesmanagementgroup@gmail.com<br>
    <span>© 2026 CHES Management Group. All rights reserved.</span>
  </footer>
</main>

<script src="/assets/i18n.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/portal.js"></script>
</body>
</html>
